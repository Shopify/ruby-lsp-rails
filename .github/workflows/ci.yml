---
name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        gemfile:
          - Gemfile
        ruby: ["4.0.5", "4.0.6"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }} with ${{matrix.gemfile}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove Gemfile.lock
        shell: bash
        run: "rm -Rf ${{ matrix.gemfile }}.lock"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler: latest
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 8

      # Run the suite verbosely so the log shows which test is executing.
      # If the suite hangs (Ruby 4.0.6 + Rails 8.1 hang under investigation),
      # send SIGINT after 15 minutes so Minitest reports the interrupted test
      # with a backtrace of where it was stuck, instead of the job being
      # cancelled with no output.
      - name: Run tests
        shell: bash
        run: |
          bundle exec rails db:setup
          bundle exec rake TESTOPTS="--verbose" &
          TEST_PID=$!
          (
            sleep 900
            echo "=== Watchdog: sending SIGINT to test process after 15 minutes ==="
            kill -INT "$TEST_PID" 2>/dev/null
            sleep 60
            echo "=== Watchdog: test process did not exit after SIGINT, sending SIGKILL ==="
            kill -KILL "$TEST_PID" 2>/dev/null
          ) &
          WATCHDOG_PID=$!
          set +e
          wait "$TEST_PID"
          STATUS=$?
          set -e
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit "$STATUS"

  # Boots the exact same `rails runner .../server.rb start` subprocess the
  # RunnerClient spawns, in a loop, without any LSP machinery. If the Rails
  # boot deadlock reproduces here, we get a minimal repro plus an
  # Interrupt backtrace from inside the hung process.
  boot-loop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ruby: ["4.0.5", "4.0.6"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
    name: Boot loop Ruby ${{ matrix.ruby }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Remove Gemfile.lock
        shell: bash
        run: "rm -Rf Gemfile.lock"

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler: latest
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 8

      - name: Boot rails runner repeatedly
        shell: bash
        run: |
          bundle exec rails db:setup
          for i in $(seq 1 100); do
            echo "=== Iteration $i"
            printf '' | RUBY_LSP_RAILS_RUNNER=true bundle exec rails runner \
              "lib/ruby_lsp/ruby_lsp_rails/server.rb" start '{"supports_progress":false}' &
            BOOT_PID=$!
            (
              sleep 90
              echo "=== HANG on iteration $i: dumping native backtraces of all threads ==="
              if command -v gdb >/dev/null; then
                sudo gdb -p "$BOOT_PID" -batch \
                  -ex 'set pagination off' \
                  -ex 'thread apply all bt' 2>&1 || true
              elif command -v lldb >/dev/null; then
                sudo lldb -p "$BOOT_PID" -batch \
                  -o 'thread backtrace all' -o 'detach' 2>&1 || true
              fi
              echo "=== Sending SIGINT for a Ruby backtrace ==="
              kill -INT "$BOOT_PID" 2>/dev/null
              sleep 20
              echo "=== Still alive after SIGINT, sending SIGABRT for a crash report ==="
              kill -ABRT "$BOOT_PID" 2>/dev/null
              sleep 20
              kill -KILL "$BOOT_PID" 2>/dev/null
            ) &
            WATCHDOG_PID=$!
            set +e
            wait "$BOOT_PID"
            STATUS=$?
            set -e
            kill "$WATCHDOG_PID" 2>/dev/null || true
            if [ "$STATUS" -ne 0 ]; then
              echo "=== Iteration $i exited with status $STATUS"
              exit "$STATUS"
            fi
          done
